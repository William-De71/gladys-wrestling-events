<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534">
  <!-- Cover of the Wrestling Events integration for Gladys Assistant
       (illustration, no logo of any promotion). A wrestling ring under the
       arena spotlights, a calendar card with the next show. Built into
       cover.jpg by scripts/build-cover.sh. -->
  <defs>
    <linearGradient id="arena" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07090f"/>
      <stop offset="0.6" stop-color="#151a2c"/>
      <stop offset="1" stop-color="#241236"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#fff4d6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff4d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f3f8"/>
      <stop offset="1" stop-color="#c9cfdc"/>
    </linearGradient>
    <linearGradient id="apron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b3112a"/>
      <stop offset="1" stop-color="#6e0a1a"/>
    </linearGradient>
    <linearGradient id="post" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d96a8"/>
      <stop offset="0.5" stop-color="#e7ebf2"/>
      <stop offset="1" stop-color="#7d8597"/>
    </linearGradient>
  </defs>
  <rect width="800" height="534" fill="url(#arena)"/>

  <!-- spotlight beams -->
  <path d="M150 0 L250 0 L420 330 L300 330 Z" fill="url(#spot)" opacity="0.55"/>
  <path d="M550 0 L650 0 L500 330 L380 330 Z" fill="url(#spot)" opacity="0.55"/>
  <path d="M360 0 L440 0 L470 330 L330 330 Z" fill="url(#spot)" opacity="0.7"/>

  <!-- the crowd: rows of dots -->
  <g fill="#2c3350">
    <circle cx="40" cy="300" r="9"/><circle cx="70" cy="296" r="9"/><circle cx="100" cy="301" r="9"/>
    <circle cx="130" cy="297" r="9"/><circle cx="160" cy="302" r="9"/><circle cx="640" cy="300" r="9"/>
    <circle cx="670" cy="296" r="9"/><circle cx="700" cy="301" r="9"/><circle cx="730" cy="297" r="9"/>
    <circle cx="760" cy="302" r="9"/><circle cx="55" cy="322" r="10"/><circle cx="88" cy="318" r="10"/>
    <circle cx="121" cy="323" r="10"/><circle cx="154" cy="319" r="10"/><circle cx="650" cy="322" r="10"/>
    <circle cx="683" cy="318" r="10"/><circle cx="716" cy="323" r="10"/><circle cx="749" cy="319" r="10"/>
  </g>
  <g fill="#ffe08a" opacity="0.8">
    <circle cx="92" cy="282" r="2"/><circle cx="702" cy="286" r="2"/><circle cx="140" cy="280" r="2"/>
    <circle cx="668" cy="279" r="2"/>
  </g>

  <!-- the ring -->
  <path d="M190 300 L610 300 L680 400 L120 400 Z" fill="url(#mat)"/>
  <path d="M120 400 L680 400 L680 450 L120 450 Z" fill="url(#apron)"/>
  <path d="M120 450 L680 450 L680 456 L120 456 Z" fill="#3d0612"/>
  <!-- ropes -->
  <g stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M196 236 L604 236" stroke="#d6283f"/>
    <path d="M196 258 L604 258" stroke="#f2f4f8"/>
    <path d="M196 280 L604 280" stroke="#2f62c9"/>
    <path d="M130 330 L196 236 M130 352 L196 258 M130 374 L196 280" stroke="#e6e9f0" opacity="0.9"/>
    <path d="M670 330 L604 236 M670 352 L604 258 M670 374 L604 280" stroke="#e6e9f0" opacity="0.9"/>
    <path d="M130 330 L670 330" stroke="#d6283f"/>
    <path d="M130 352 L670 352" stroke="#f2f4f8"/>
    <path d="M130 374 L670 374" stroke="#2f62c9"/>
  </g>
  <!-- posts -->
  <rect x="188" y="222" width="16" height="80" rx="4" fill="url(#post)"/>
  <rect x="596" y="222" width="16" height="80" rx="4" fill="url(#post)"/>
  <rect x="120" y="314" width="20" height="96" rx="5" fill="url(#post)"/>
  <rect x="660" y="314" width="20" height="96" rx="5" fill="url(#post)"/>

  <!-- the calendar card of the next show -->
  <g transform="translate(470 54)">
    <rect width="270" height="150" rx="16" fill="#ffffff" opacity="0.96"/>
    <path d="M0 16 a16 16 0 0 1 16 -16 h238 a16 16 0 0 1 16 16 v28 h-270 Z" fill="#c8102e"/>
    <rect x="34" y="-10" width="10" height="24" rx="5" fill="#e7ebf2"/>
    <rect x="226" y="-10" width="10" height="24" rx="5" fill="#e7ebf2"/>
    <text x="135" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="18" fill="#ffffff" letter-spacing="3">NEXT SHOW</text>
    <text x="24" y="92" font-family="Impact, 'Arial Black', Arial, sans-serif" font-weight="900" font-size="44" fill="#151a2c">SAT 20:00</text>
    <rect x="24" y="110" width="58" height="22" rx="11" fill="#f9d8de"/>
    <rect x="92" y="110" width="58" height="22" rx="11" fill="#dbe6fb"/>
    <rect x="160" y="110" width="58" height="22" rx="11" fill="#fdecc8"/>
  </g>

  <!-- title -->
  <text x="40" y="96" font-family="Impact, 'Arial Black', Arial, sans-serif" font-weight="900" font-size="64" fill="#ffffff" letter-spacing="2">WRESTLING</text>
  <text x="40" y="160" font-family="Impact, 'Arial Black', Arial, sans-serif" font-weight="900" font-size="64" fill="#ffd34d" letter-spacing="2">EVENTS</text>
  <text x="42" y="196" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#c9cfdc">for Gladys Assistant</text>

  <!-- footer band -->
  <rect x="0" y="484" width="800" height="50" fill="#07090f" opacity="0.85"/>
  <text x="400" y="516" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#e7ebf2" letter-spacing="1">Calendars · Reminders · Widgets — from TheSportsDB</text>
</svg>
